name: Instagram dnevna objava

on:
  schedule:
    # 17:43 po bosanskom vremenu; GitHub zna kasniti ili preskočiti pokretanje, zato više pokušaja.
    # Skripta sama provjerava vrijeme i ne objavljuje dvaput.
    - cron: "43 15 * * *"
    - cron: "43 16 * * *"
    - cron: "13,43 17,18,19 * * *"
    - cron: "30 21 * * *"
  push:
    paths:
      - "stanje/pokreni.txt"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: objava
  cancel-in-progress: false

jobs:
  objavi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - name: Git korisnik
        run: |
          git config user.name "video-nadzor-bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Objava i Story
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: python alati/objavi.py
      - name: Komentari
        if: always()
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python alati/komentari.py
          git add stanje && (git diff --cached --quiet || (git commit -q -m "Komentari" && (git push -q || (git pull -q --rebase && git push -q))))
